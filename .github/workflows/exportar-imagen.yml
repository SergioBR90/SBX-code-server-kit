name: Construir y exportar Code Server

on:
  workflow_dispatch:

jobs:
  construir-y-exportar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: |
          docker build \
            --tag mi-code-server:latest \
            .

      - name: Verificar imagen creada
        run: |
          docker images mi-code-server:latest
          docker image inspect mi-code-server:latest

      - name: Exportar imagen a archivo TAR
        run: |
          docker save \
            --output mi-code-server.tar \
            mi-code-server:latest

      - name: Comprimir imagen
        run: |
          gzip -9 mi-code-server.tar

      - name: Publicar archivo como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-code-server-docker-image
          path: mi-code-server.tar.gz
          retention-days: 7
